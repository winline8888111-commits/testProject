<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070b" />
  <meta name="description" content="3D веб-открытка ко дню рождения." />
  <title>С днём рождения ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Поздравительная открытка">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>

      <div class="hearts" aria-hidden="true">
        <div class="heart heart-red heart-1"><span>❤</span></div>
        <div class="heart heart-pink heart-2"><span>❤</span></div>
        <div class="heart heart-purple heart-3"><span>❤</span></div>
        <div class="heart heart-crimson heart-4"><span>❤</span></div>
        <div class="heart heart-red heart-5"><span>❤</span></div>
        <div class="heart heart-pink heart-6"><span>❤</span></div>
      </div>

      <div class="content">
        <div class="eyebrow">особенный день</div>
        <h1>С днём<br /><span>рождения!</span></h1>
        <p class="name" id="recipientName">Имя</p>
        <p class="message" id="message">
          Пусть каждый новый день будет наполнен светом, красивыми моментами,
          любовью и поводами улыбаться.
        </p>
        <button class="wish-button" id="wishButton" type="button">
          <span class="button-spark">✦</span>
          Открыть пожелание
        </button>
        <p class="signature" id="signature">С теплом и любовью ♥</p>
      </div>

      <div class="orbit orbit-1"></div>
      <div class="orbit orbit-2"></div>
      <div class="grain"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
