<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070b" />
  <meta name="description" content="3D веб-открытка ко дню рождения." />
  <title>Для тебя ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="intro-page">
  <main class="page">
    <section class="card intro-card" aria-label="Вступление к открытке">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>

      <div class="hearts" aria-hidden="true">
        <div class="heart heart-red heart-1"><span>❤</span></div>
        <div class="heart heart-pink heart-2"><span>❤</span></div>
        <div class="heart heart-purple heart-3"><span>❤</span></div>
        <div class="heart heart-crimson heart-4"><span>❤</span></div>
        <div class="heart heart-red heart-5"><span>❤</span></div>
        <div class="heart heart-pink heart-6"><span>❤</span></div>
      </div>

      <div class="content intro-content">
        <div class="eyebrow">небольшой сюрприз</div>
        <div class="intro-heart" aria-hidden="true">♥</div>
        <h1 class="intro-title">Для тебя<br /><span>есть кое-что особенное</span></h1>
        <p class="intro-text">Нажми на кнопку — и откроется поздравление, которое я приготовил специально для тебя.</p>

        <a class="wish-button page-link" href="page2.html" data-transition>
          <span class="button-spark">✦</span>
          Открыть открытку
        </a>

        <p class="signature">С любовью ♥</p>
      </div>

      <div class="orbit orbit-1"></div>
      <div class="orbit orbit-2"></div>
      <div class="grain"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
